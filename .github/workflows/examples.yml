name: Run Examples

# Runs every example in this repository — the raw SDK tutorials and the Spring
# enterprise runners — against a throwaway Hiero network started by
# hiero-solo-action, so no testnet account or funded operator is needed.

on:
  workflow_dispatch:
    inputs:
      enterpriseRef:
        description: "Branch/tag of hiero-enterprise-java to build the library from"
        required: false
        default: "main"
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Examples on Hiero Solo
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The examples depend on a -SNAPSHOT of hiero-enterprise-java, which is not
      # published to a remote repository, so it is built from source and installed
      # into the local Maven repository.
      - name: Checkout hiero-enterprise-java
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hiero-ledger/hiero-enterprise-java
          ref: ${{ github.event.inputs.enterpriseRef || 'main' }}
          path: hiero-enterprise-java

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Install hiero-enterprise-java into the local repository
        working-directory: hiero-enterprise-java
        run: ./mvnw -B -q install -Dmaven.test.skip=true -Dspotless.check.skip=true

      - name: Check the examples compile
        run: mvn -B -q compile

      - name: Prepare Hiero Solo
        id: solo
        uses: hiero-ledger/hiero-solo-action@c5326debc5b38e50fa4032361c0a35f46166c0e7 # v0.25.0
        with:
          installMirrorNode: true

      - name: Wait for Mirror Node
        run: |
          echo "Waiting for Mirror Node REST (Node.js) on http://localhost:38081..."
          until curl --output /dev/null --silent --fail http://localhost:38081/health/readiness; do
            echo "Mirror Node (rest) not ready, waiting..."
            kubectl get svc -n solo || true
            sleep 5
          done
          echo "Waiting for Mirror Node REST-Java on http://localhost:8084..."
          until curl --output /dev/null --silent --fail http://localhost:8084/actuator/health/readiness; do
            echo "Mirror Node (rest-java) not ready, waiting..."
            sleep 5
          done
          echo "Mirror Node APIs are ready!"

      # One .env drives both flavours of example: the SDK tutorials read
      # OPERATOR_ID / OPERATOR_KEY / HEDERA_NETWORK through Dotenv, and Spring
      # imports the same file for its spring.hiero.* properties.
      - name: Write .env for the Solo network
        env:
          SOLO_ACCOUNT_ID: ${{ steps.solo.outputs.accountId }}
          SOLO_PRIVATE_KEY: ${{ steps.solo.outputs.privateKey }}
        run: |
          cat > .env <<EOF
          spring.hiero.accountId=$SOLO_ACCOUNT_ID
          spring.hiero.privateKey=$SOLO_PRIVATE_KEY
          spring.hiero.network.name=hiero-solo-action
          spring.hiero.network.mirror-node-java-rest=http://localhost:8084

          OPERATOR_ID=$SOLO_ACCOUNT_ID
          OPERATOR_KEY=$SOLO_PRIVATE_KEY
          HEDERA_NETWORK=hiero-solo-action
          EOF
          echo "Wrote .env for account $SOLO_ACCOUNT_ID on hiero-solo-action"

      - name: Run all examples
        env:
          EXAMPLE_TIMEOUT: "600"
        run: ./scripts/run-examples.sh

      - name: Upload example logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: example-logs
          path: target/example-logs/
          if-no-files-found: ignore
          retention-days: 7
